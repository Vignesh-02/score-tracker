# Nginx site for Score Tracker: serves the React app's built files and proxies
# the API, WebSocket and health check to Node on 127.0.0.1:8000.
#
# Install:  see deploy/README.md. Get the certificate first (one certificate
#           covers all four names below), because this file refers to its
#           files; then copy this file to /etc/nginx/sites-available/, link it
#           into sites-enabled/, and run: sudo nginx -t && sudo systemctl reload nginx
#           Certbot renews the certificate automatically.
#
# The site lives at https://khelscores.com. www.khelscores.com, khelscores.in
# and www.khelscores.in all redirect there.

# "Connection: upgrade" for WebSocket handshakes, "close" for anything else
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream score_tracker {
    server 127.0.0.1:8000;
    # Reuse connections to Node instead of opening one per request
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name khelscores.com www.khelscores.com khelscores.in www.khelscores.in;

    # Certbot's HTTP challenge, then everything else goes to HTTPS on the main domain
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://khelscores.com$request_uri;
    }
}

# The other names redirect to the main domain over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.khelscores.com khelscores.in www.khelscores.in;

    ssl_certificate     /etc/letsencrypt/live/khelscores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khelscores.com/privkey.pem;

    return 301 https://khelscores.com$request_uri;
}

server {
    # "listen ... http2" works on every Nginx version; on 1.25.1+ it prints a
    # deprecation warning and you can switch to a separate "http2 on;" line
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khelscores.com;

    # Written by certbot; the folder is named after the first -d domain
    ssl_certificate     /etc/letsencrypt/live/khelscores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khelscores.com/privkey.pem;

    # The React app, built with `npm run build` in client/
    root /srv/score-tracker/client/dist;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Overwrite (not append to) X-Forwarded-For with the real visitor's address,
    # so clients can't fake their IP to dodge the app's rate limits. If you put
    # Cloudflare or another proxy in front of Nginx, this needs changing.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket. The app pings every 30s, so a 120s read timeout only closes
    # connections that are genuinely dead.
    location = /ws {
        proxy_pass http://score_tracker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # REST API and health check
    location ~ ^/(matches|health)(/|$) {
        proxy_pass http://score_tracker;
        proxy_http_version 1.1;
        # Needed for the upstream keepalive above
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Built JS/CSS have a content hash in their names, so they can be cached
    # forever; a new build gets new names
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Everything else is the single-page app. index.html is never cached, so
    # visitors get a new build as soon as it's deployed.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
